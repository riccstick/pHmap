[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "phmap"
version = "2.0.0a1"
description = "Generate pH-dependent protein electrostatic surface maps locally"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Erik Breslmayr" }]
keywords = ["protein", "electrostatics", "APBS", "PDB2PQR", "PyMOL"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "Pillow>=11.0,<13",
]

[project.scripts]
phmap = "phmap.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phmap"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["phmap"]
# The Pixi scientific environment includes NumPy/PyMOL stubs that may target
# Python 3.12. Check pHmap at its declared minimum without recursively parsing
# unrelated third-party implementation stubs.
follow_imports = "skip"
